<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ → RU ТРЕНАЖЕР</title>
<style>
  *{box-sizing:border-box; font-family: system-ui, sans-serif}
  body{margin:0; background:#f6f7fb; display:flex; justify-content:center; min-height:100vh; padding:20px}
 .app{width:100%; max-width:420px; background:white; border-radius:20px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,.08); margin:auto}
  h1{font-size:20px; text-align:center; margin:0 0 4px}
 .sub{color:#888; text-align:center; font-size:13px; margin-bottom:12px}
 .cats{display:flex; gap:6px; overflow:auto; padding-bottom:10px; margin-bottom:12px}
 .cat{white-space:nowrap; padding:6px 10px; border-radius:20px; border:1px solid #eee; background:#fff; font-size:12px; cursor:pointer}
 .cat.active{background:#6c5ce7; color:#fff; border-color:#6c5ce7}
 .progress{height:6px; background:#eee; border-radius:10px; overflow:hidden; margin-bottom:18px}
 .bar{height:100%; background:#6c5ce7; width:0%; transition:.4s}
 .card{background:#f9f9ff; border-radius:16px; padding:18px; text-align:center; margin-bottom:16px}
 .az-word{font-size:32px; font-weight:800; margin:6px 0}
 .az-translit{color:#999; font-size:13px}
 .options{display:grid; gap:10px}
 .opt{padding:14px; border:2px solid #eee; border-radius:12px; background:white; font-size:16px; font-weight:600; cursor:pointer; transition:.2s; text-align:left; display:flex; justify-content:space-between}
 .opt:hover{border-color:#6c5ce7}
 .opt.correct{border-color:#00b894; background:#e8fff5; color:#00b894}
 .opt.wrong{border-color:#ff7675; background:#ffecec; color:#d63031}
 .feedback{min-height:48px; margin-top:14px; padding:12px; border-radius:10px; font-size:14px; display:none}
 .feedback.show{display:block}
 .feedback.ok{background:#e8fff5; color:#00b894}
 .feedback.err{background:#ffecec; color:#d63031}
 .next{width:100%; margin-top:16px; padding:14px; border:none; border-radius:12px; background:#6c5ce7; color:white; font-weight:700; font-size:15px; display:none; cursor:pointer}
 .next.show{display:block}
 .stats{display:flex; justify-content:space-between; font-size:12px; color:#999; margin-bottom:10px}
</style>
</head>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <button class="next" id="next">Далее →</button>

  {az:"Dərs", ru:"Урок", cat:"Учеба", opts:["Урок","Школа","Работа","Книга"]},

let currentCat = "Все";
let words = [...allWords];
let idx = 0, score = 0, locked = false;

function initCats(){
  const cats = ["Все",...new Set(allWords.map(w=>w.cat))];
  const cont = document.getElementById('cats');
  cont.innerHTML = "";
  cats.forEach(c=>{
    const b = document.createElement('button');
    b.className = "cat" + (c===currentCat?" active":"");
    b.textContent = c;
    b.onclick = ()=>{
      currentCat=c;
      words = c==="Все"? [...allWords] : allWords.filter(w=>w.cat===c);
      idx=0; score=0;
      document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      render();
    };
    cont.appendChild(b);
  });
}

function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}

function render(){
  locked=false;
  if(words.length===0) return;
  const w = words[idx];
  document.getElementById('catLabel').textContent = w.cat.toUpperCase();
  document.getElementById('azWord').textContent = w.az;
  document.getElementById('azTranslit').textContent = w.ru + " ← правильный ответ";
  document.getElementById('count').textContent = `${idx+1} / ${words.length}`;
  document.getElementById('bar').style.width = `${(idx/words.length)*100}%`;
  const opts = shuffle(w.opts);
  const cont = document.getElementById('options');
  cont.innerHTML = "";
  opts.forEach(o=>{
    const b = document.createElement('button');
    b.className = "opt";
    b.innerHTML = `<span>${o}</span><span>→</span>`;
    b.onclick = ()=> check(b,o,w.ru);
    cont.appendChild(b);
  });
  document.getElementById('feedback').className="feedback";
  document.getElementById('feedback').style.display="none";
  document.getElementById('next').className="next";
  document.getElementById('score').textContent = `✅ ${score}`;
}

function check(btn, chosen, correct){
  if(locked) return;
  locked=true;
  const fb = document.getElementById('feedback');
  const all = document.querySelectorAll('.opt');
  if(chosen===correct){
    btn.classList.add('correct');
    fb.textContent = `✅ Правильно! ${words[idx].az} = ${correct}`;
    fb.className = "feedback show ok";
    fb.style.display="block";
    score++;
  } else {
    btn.classList.add('wrong');
    all.forEach(x=>{ if(x.textContent.includes(correct)) x.classList.add('correct') });
    fb.innerHTML = `❌ Неправильно. Вы выбрали: <b>${chosen}</b><br>✅ Правильно: <b>${words[idx].az} = ${correct}</b>`;
    fb.className = "feedback show err";
    fb.style.display="block";
  }
  document.getElementById('score').textContent = `✅ ${score}`;
  document.getElementById('next').classList.add('show');
}

document.getElementById('next').onclick = ()=>{
  idx++;
  if(idx>=words.length){
    alert(`Готово! Категория ${currentCat}: ${score}/${words.length}`);
    idx=0; score=0;
  }
  render();
}

initCats();
render();
</script>
