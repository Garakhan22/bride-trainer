<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТРЕНАЖЕР</title>
<style>
  *{box-sizing:border-box; font-family: system-ui, -apple-system, sans-serif}
  body{
    margin:0; min-height:100vh; padding:20px;
    display:flex; justify-content:center;
    background: #fff9f7 url('bride_bg.jpg') no-repeat center center fixed;
    background-size: cover;
  }
  body::before{
    content:''; position:fixed; inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,240,235,0.85));
    z-index:-1
  }
 .app{
    width:100%; max-width:430px;
    background:rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-radius:24px; padding:26px;
    box-shadow:0 20px 40px rgba(180,120,120,.15);
    border:1px solid rgba(255,255,255,0.8)
  }
  h1{font-size:20px; text-align:center; margin:0; color:#5a3a3a}
 .sub{color:#b08d8d; text-align:center; font-size:12px; margin:6px 0 18px; letter-spacing:1px}
 .progress{height:6px; background:#f3e8e6; border-radius:10px; overflow:hidden; margin-bottom:18px}
 .bar{height:100%; background:linear-gradient(90deg, #e8a0bf, #d4a5a5); width:0%; transition:.4s}
 .card{background:linear-gradient(135deg, #fffaf9, #fff1f0); border-radius:18px; padding:20px; text-align:center; margin-bottom:16px; border:1px solid #ffe8e3}
 .az-word{font-size:34px; font-weight:800; color:#6b4444}
 .speak-btn{
    margin-top:12px; padding:10px 20px; border:none;
    background:linear-gradient(90deg, #e8a0bf, #c995a5);
    color:white; border-radius:30px; font-weight:700;
    cursor:pointer; box-shadow:0 4px 12px rgba(232,160,191,.4)
  }
 .options{display:grid; gap:10px}
 .opt{
    padding:14px; border:2px solid #f3e0dd; border-radius:14px;
    background:white; font-size:15px; font-weight:600;
    cursor:pointer; display:flex; justify-content:space-between; transition:.2s
  }
 .opt:hover{border-color:#e8a0bf; transform:translateY(-1px)}
 .opt.correct{border-color:#a3d9b1; background:#eafff1; color:#2d8a4e}
 .opt.wrong{border-color:#ffb8b8; background:#fff0f0; color:#d44; animation:shake.3s}
 .feedback{margin-top:14px; padding:12px; border-radius:12px; display:none; font-size:14px}
 .feedback.show{display:block}
 .feedback.ok{background:#eafff1; color:#2d8a4e}
 .feedback.err{background:#fff0f0; color:#a33}
 .next{width:100%; margin-top:16px; padding:14px; border:none; border-radius:14px; background:#6b4444; color:white; font-weight:700; display:none; cursor:pointer}
 .next.show{display:block}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
</head>
<body>
<div class="app">
  <h1> AZ → RU </h1>
  <div class="sub">ТРЕНАЖЕР</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="card">
    <div style="font-size:10px; letter-spacing:2px; color:#c995a5">AZƏRBAYCANCA</div>
    <div class="az-word" id="azWord">Salam</div>
    <button class="speak-btn" onclick="speakCurrent()">🔊 Послушать по-русски</button>
    <div id="ruHint" style="margin-top:8px; font-size:12px; color:#c4a6a6"></div>
  </div>
  <div id="options" class="options"></div>
  <div id="feedback" class="feedback"></div>
  <button id="next" class="next">Далее →</button>
</div>

<script>
const words = [
  {az:"Salam", ru:"Привет", opts:["Привет","Пока","Спасибо","Да"]},
  {az:"Sevgi", ru:"Любовь", opts:["Любовь","Счастье","Семья","Сердце"]},
  {az:"Gəlin", ru:"Невеста", opts:["Невеста","Жених","Свадьба","Платье"]},
  {az:"Bəy", ru:"Жених", opts:["Жених","Невеста","Друг","Брат"]},
  {az:"Toy", ru:"Свадьба", opts:["Свадьба","Праздник","Дом","Любовь"]},
  {az:"Üzük", ru:"Кольцо", opts:["Кольцо","Сердце","Цветы","Платье"]},
  {az:"Gül", ru:"Цветок", opts:["Цветок","Роза","Любовь","Весна"]},
  {az:"Gözəl", ru:"Красивый", opts:["Красивый","Нежный","Милая","Счастливый"]},
  {az:"Xoşbəxt", ru:"Счастливый", opts:["Счастливый","Красивый","Добрый","Милый"]},
  {az:"Ailə", ru:"Семья", opts:["Семья","Любовь","Дом","Счастье"]},
  {az:"Öpüş", ru:"Поцелуй", opts:["Поцелуй","Любовь","Сердце","Объятие"]},
  {az:"Ürək", ru:"Сердце", opts:["Сердце","Душа","Любовь","Жизнь"]},
];

let idx=0, locked=false;

function speak(t){
  window.speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(t);
  u.lang='ru-RU';
  u.rate=0.85;
  let voices = window.speechSynthesis.getVoices();
  let ru = voices.find(v=>v.lang.includes('ru'));
  if(ru) u.voice = ru;
  window.speechSynthesis.speak(u);
}

function speakCurrent(){
  speak(words[idx].ru);
  document.getElementById('ruHint').textContent = words[idx].ru + " 🔊";
}

function render(){
  locked=false;
  let w=words[idx];
  document.getElementById('azWord').textContent=w.az;
  document.getElementById('ruHint').textContent='';
  document.getElementById('bar').style.width=(idx/words.length*100)+'%';
  let c=document.getElementById('options');
  c.innerHTML='';
  [...w.opts].sort(()=>Math.random()-0.5).forEach(o=>{
    let b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span>${o}</span><span>🤍</span>`;
    b.onclick=()=>{
      if(locked) return;
      locked=true;
      let fb=document.getElementById('feedback');
      if(o===w.ru){
        b.classList.add('correct');
        fb.textContent=`✅ Правильно! ${w.az} = ${w.ru}`;
        fb.className='feedback show ok';
        speak(w.ru);
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.opt').forEach(x=>{
          if(x.textContent.includes(w.ru)) x.classList.add('correct')
        });
        fb.innerHTML=`❌ Неправильно: <b>${o}</b><br>✅ Правильно: <b>${w.az} = ${w.ru}</b>`;
        fb.className='feedback show err';
        setTimeout(()=>speak(w.ru),300);
      }
      fb.style.display='block';
      document.getElementById('next').classList.add('show');
    };
    c.appendChild(b);
  });
  document.getElementById('feedback').style.display='none';
  document.getElementById('next').className='next';
}

document.getElementById('next').onclick=()=>{
  idx=(idx+1)%words.length;
  if(idx===0) words.sort(()=>Math.random()-0.5);
  render();
};

window.speechSynthesis.onvoiceschanged = ()=> window.speechSynthesis.getVoices();
render();
</script>
</body>
</html>
